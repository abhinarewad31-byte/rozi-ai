name: Build Rozi Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/rozi-debug.apk

      - name: Record APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rozi-debug-apk-archive
          path: app/build/outputs/apk/debug/rozi-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rozi-debug-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" app/build/outputs/apk/debug/rozi-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rozi debug APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Debug APK generated by GitHub Actions run ${GITHUB_RUN_ID}."

